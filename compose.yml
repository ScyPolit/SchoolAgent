name: school-agent
services:
  app:
    build: .
    image: school-agent:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/school-agent.sqlite
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      ENABLE_DEMO_ADAPTER: "false"
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    secrets:
      - encryption_key
    volumes:
      - school_data:/app/data
      - school_backups:/app/backups
    networks:
      - backplane
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    stop_grace_period: 40s
  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backplane
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
networks:
  backplane:
    internal: true
  egress: {}
  edge: {}
volumes:
  school_data: {}
  school_backups: {}
secrets:
  encryption_key:
    file: ./.secrets/encryption_key
