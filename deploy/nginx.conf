# Container ingress is bound to host loopback by default. A school reverse proxy
# terminates HTTPS and restricts source networks to campus/VPN.
# Email tokens live in query strings; share paths also carry bearer identifiers.
# Do not log query strings, referrers, cookies, request bodies or authorization.
map $uri $school_log_uri {
    default $uri;
    ~^/api/shares/ /api/shares/redacted;
    ~^/share/ /share/redacted;
}
log_format school_safe '$remote_addr [$time_local] "$request_method $school_log_uri $server_protocol" $status $body_bytes_sent';
map $http_x_forwarded_proto $school_forwarded_proto {
    default $scheme;
    https https;
}
upstream school_agent {
    server app:3000;
    keepalive 32;
}
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log school_safe;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 2m;
    location / {
        proxy_pass http://school_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $school_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        add_header X-Accel-Buffering no always;
    }
}
